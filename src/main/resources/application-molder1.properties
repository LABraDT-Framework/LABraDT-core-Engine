# Second machine instance for the multi-machine demo (placeholder injection molder)
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=molder1

# AASX file path
engine.aasx.path=src/main/resources/Molder.aasx

# Entry path of the Rules_SM XML inside the AASX zip
engine.rules.submodel.entry=aasx/Molder-AAS/Molder-AAS.aas.xml

# Retry settings and recovery timeout after ERROR
engine.retry.max=3
engine.service.retryDelayMs=2000
engine.error.recoveryTimeoutMs=5000

# File storage path for persistent AAS data (separate from cnc-1)
engine.storage.path=storage-molder1

# H2 Database (separate file from cnc-1 instance)
spring.datasource.url=jdbc:h2:file:./data/machinetool-db-molder1;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# External Gateway SSE stream (same gateway, different machineId)
gateway.submodelId=CPS_SM
gateway.machineId=molder-1
gateway.url=http://localhost:8085/api/submodel/stream
gateway.write.url=http://localhost:8085

# External service execution endpoint (same component, different service IDs)
service.execution.url=http://localhost:8082/services/trigger

# This instance's own port and callback URL
server.port=8081
engine.callback.url=http://localhost:8081/engine/result
