# AASX file path
engine.aasx.path=src/main/resources/MachineTool.aasx

# Entry path of the Rules_SM XML inside the AASX zip
engine.rules.submodel.entry=aasx/MachineTool-AAS/MachineTool-AAS.aas.xml

# Retry settings (delay between retries: engine.service.retryDelayMs, default 0)
engine.retry.max=3

# File storage path for persistent AAS data
engine.storage.path=storage

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/machinetool-db;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# External service execution endpoint
# service.execution.url=http://localhost:8081/api/execute

# External Gateway SSE stream
gateway.submodelId=CPS_SM
# The Gateway tags events by its own config name. For the mock stack this is
# "cnc-line1" (dt-gateway-app/src/main/resources/configs/cnc-line1.json in the
# gateway project), not "osaca-lab" (the real lab machine's config, under
# configs-lab/ in the gateway project).
gateway.machineId=cnc-line1

# This instance's own port. 8085 and 8082 below are reserved for the
# Gateway and the Service Manager, so this stays on 8080 without colliding
# with either.
server.port=8080
server.error.include-message=always

# The Gateway listens on 8085 in every profile (mock and lab); see
# dt-gateway-app/src/main/resources/application.properties in the gateway project.
gateway.url=http://localhost:8085/api/submodel/stream
gateway.write.url=http://localhost:8085
# Timeouts for the write back PATCH to the Gateway (ms). The Gateway itself waits
# up to 5 s for a write, so the read timeout stays above that. A timeout is
# logged as "Write back failed" and the engine carries on (no hang).
# Override with GATEWAY_WRITE_CONNECT_TIMEOUT_MS / GATEWAY_WRITE_READ_TIMEOUT_MS.
gateway.write.connect-timeout-ms=3000
gateway.write.read-timeout-ms=10000

service.execution.url=http://localhost:8082/services/trigger
engine.callback.url=http://localhost:8080/engine/result
engine.error.recoveryTimeoutMs=5000
